<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Lista de Frequência Digital</title>
    <style>
        :root{--accent:#0b74e6; --danger:#ef4444; --warning:#f97316; --bg-light:#f5f7fb;}
        
        body {
            font-family: Inter, system-ui, sans-serif;
            margin: 0; padding: 15px; 
            background-color: #f5f7fb;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header-container { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .logo-escola { height: 50px; width: auto; object-fit: contain; }
        h1 { margin: 0; font-size: 20px; color: #333; }

        .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        input, button { padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 14px; }
        button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
        button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
        button.danger { background: var(--danger); color: #fff; }
        
        #searchInput { background: #fff; border: 2px solid var(--accent); flex-grow: 1; font-size: 16px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
        th, td { padding: 8px; border-bottom: 1px solid #eef2f7; text-align: left; }
        th { background: #f8fafc; }
        
        /* Controle de visibilidade da lista */
        #tableBody tr { display: table-row; } /* Mostra por padrão no Admin */
        body.modo-colaborador #tableBody tr { display: none; } /* Esconde no modo QR Code/Colaborador */
        .mostrar-linha { display: table-row !important; }

        .signed-thumb { height: 40px; border-radius: 4px; border: 1px solid #ddd; margin-right: 3px; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .card { background: #fff; padding: 15px; border-radius: 12px; width: 95%; max-width: 600px; max-height: 95vh; overflow-y: auto; position: relative;}
        
        .signature-wrapper { 
            border: 2px dashed #ccc; 
            border-radius: 8px; 
            background: #fff; 
            width: 100%; 
            height: 200px; 
            position: relative;
            touch-action: none; /* CORREÇÃO: Impede a tela de rolar ao assinar */
        }
        .signature-canvas { width: 100%; height: 100%; cursor: crosshair; }
        
        #video, #photoPreview { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: #000; }
        #video { transform: scaleX(-1); }

        .status-badge { padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; }
        .status-pendente { background: #fee2e2; color: #ef4444; }
        .status-assinado { background: #dcfce7; color: #16a34a; }

        body.modo-colaborador #adminPanel { display: none; }

        @media (max-width: 600px) {
            .controls input { flex: 1; min-width: 120px; }
            th, td { padding: 5px; font-size: 12px; }
        }
    </style>
</head>
<body id="mainBody">

<div class="container">
    <div class="header-container">
        <img src="logo.png" alt="Logo" class="logo-escola" onerror="this.style.display='none'">
        <h1 id="tituloPagina">Gestão de Frequência</h1>
    </div>
    
    <div class="controls" id="adminPanel">
        <input id="nameInput" placeholder="Nome Completo"/>
        <input id="turmaInput" placeholder="Turma" style="width: 100px"/>
        <button id="addBtn">Adicionar</button>
        <button onclick="document.getElementById('importFile').click()" class="ghost">Importar TXT</button>
        <input type="file" id="importFile" style="display:none" accept=".txt" />
        <button id="showQrBtn" class="ghost">📲 QR Code</button>
        <button id="clearAllBtn" class="danger">Limpar Banco</button>
        <button id="generatePdf" style="margin-left:auto">Gerar PDF</button>
    </div>

    <div class="controls">
        <input id="searchInput" type="text" placeholder="🔍 BUSCAR NOME..." onkeyup="filtrarTabela()">
    </div>

    <div style="overflow-x: auto;">
        <table id="mainTable">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Nome</th>
                    <th>Turma</th>
                    <th>Assinatura/Foto</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="signModal" class="modal">
    <div class="card">
        <h2 id="nomeAssinando">Assinar</h2>
        <div id="geoStatus" style="font-size: 11px; color: var(--warning); margin-bottom: 10px;">Localizando...</div>
        
        <label style="font-size: 12px;"><b>1. Foto Selfie:</b></label>
        <video id="video" autoplay playsinline></video>
        <img id="photoPreview" style="display:none;" />
        <button id="takePhoto" style="width:100%; margin: 8px 0;">📸 Capturar Foto</button>

        <label style="font-size: 12px;"><b>2. Assinatura:</b></label>
        <div class="signature-wrapper">
            <canvas id="sigCanvas" class="signature-canvas"></canvas>
        </div>
        <button id="clearSig" class="ghost" style="width:100%; margin-top:5px;">LIMPAR ASSINATURA</button>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="fecharModais()" class="ghost" style="flex:1">Cancelar</button>
            <button id="saveData" style="flex:2; background: #16a34a;">CONFIRMAR</button>
        </div>
    </div>
</div>

<div id="qrModal" class="modal">
    <div class="card" style="text-align:center; max-width: 350px;">
        <h2>Acesso Celular</h2>
        <div id="qrcode" style="display:flex; justify-content:center; margin:20px 0"></div>
        <p style="font-size: 12px; color: #666;">Aponte a câmera para este código para assinar pelo celular.</p>
        <button onclick="fecharModais()" class="ghost" style="width: 100%">Fechar</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
    const ADMIN_PASSWORD = '1992';
    const firebaseConfig = {
        apiKey: "AIzaSyBy4gbEfmMgm-zgMmGq6h3oQ_-gQy2l2R0",
        authDomain: "frenquencia-digital.firebaseapp.com",
        databaseURL: "https://frenquencia-digital-default-rtdb.firebaseio.com",
        projectId: "frenquencia-digital",
        storageBucket: "frenquencia-digital.firebasestorage.app",
        messagingSenderId: "625078117212",
        appId: "1:625078117212:web:bc5c57e18af96b305d1799"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let sigPad, localStream, currentUserId = null;
    const urlParams = new URLSearchParams(window.location.search);
    const eModoColaborador = urlParams.has('modo');

    if (eModoColaborador) {
        document.getElementById('mainBody').classList.add('modo-colaborador');
        document.getElementById('tituloPagina').innerText = "Assinatura de Presença";
    }

    // Adicionar Manual
    document.getElementById('addBtn').onclick = () => {
        const n = document.getElementById('nameInput').value.trim();
        const t = document.getElementById('turmaInput').value.trim() || 'S/T';
        if(n) { 
            db.ref('participantes').push().set({ name: n, turma: t, signed: false });
            document.getElementById('nameInput').value = '';
            document.getElementById('turmaInput').value = '';
        }
    };

    // Importar TXT (Nome, Turma)
    document.getElementById('importFile').onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
            const lines = ev.target.result.split(/\r?\n/);
            lines.forEach(line => {
                const parts = line.split(',');
                const name = parts[0]?.trim();
                const turma = parts[1]?.trim() || 'S/T';
                if (name) db.ref('participantes').push().set({ name: name, turma: turma, signed: false });
            });
            alert("Nomes importados!");
        };
        reader.readAsText(file);
    };

    function filtrarTabela() {
        const filter = document.getElementById("searchInput").value.toUpperCase();
        const tr = document.getElementById("tableBody").getElementsByTagName("tr");
        for (let i = 0; i < tr.length; i++) {
            const txtValue = tr[i].innerText.toUpperCase();
            if (eModoColaborador) {
                // No celular, só mostra se digitar 2+ letras
                tr[i].classList.toggle('mostrar-linha', filter.length >= 2 && txtValue.indexOf(filter) > -1);
            } else {
                // No Admin, mostra tudo se busca estiver vazia
                tr[i].classList.toggle('mostrar-linha', filter === "" || txtValue.indexOf(filter) > -1);
            }
        }
    }

    db.ref('participantes').on('value', (snapshot) => {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        const data = snapshot.val();
        if (data) {
            Object.keys(data).forEach(key => {
                const p = data[key];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="status-badge ${p.signed ? 'status-assinado' : 'status-pendente'}">${p.signed ? 'Assinado' : 'Pendente'}</span></td>
                    <td><b>${p.name}</b></td>
                    <td>${p.turma || '-'}</td>
                    <td>${p.signed ? `<img src="${p.sigData}" class="signed-thumb"><img src="${p.photo}" class="signed-thumb">` : '-'}</td>
                    <td>
                        ${p.signed ? `<button class="ghost" onclick="tentarRefazer('${key}', '${p.name}')">Refazer</button>` : `<button onclick="abrirAssinatura('${key}', '${p.name}')">Assinar</button>`}
                        ${!eModoColaborador ? `<button class="danger" onclick="excluirParticipante('${key}', '${p.name}')">X</button>` : ''}
                    </td>
                `;
                tableBody.appendChild(tr);
            });
            filtrarTabela();
        }
    });

    function abrirAssinatura(id, nome) {
        currentUserId = id;
        document.getElementById('nomeAssinando').innerText = nome;
        document.getElementById('signModal').style.display = 'flex';
        setTimeout(() => {
            const canvas = document.getElementById('sigCanvas');
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            sigPad = new SignaturePad(canvas, { minWidth: 1, maxWidth: 3 });
        }, 300);
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => {
            localStream = s;
            document.getElementById('video').srcObject = s;
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('video').style.display = 'block';
        });
    }

    document.getElementById('takePhoto').onclick = () => {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0);
        document.getElementById('photoPreview').src = canvas.toDataURL('image/jpeg');
        document.getElementById('photoPreview').style.display = 'block';
        document.getElementById('video').style.display = 'none';
    };

    document.getElementById('saveData').onclick = () => {
        const photo = document.getElementById('photoPreview').src;
        if(sigPad.isEmpty() || !photo.startsWith('data')) return alert("Foto e Assinatura obrigatórias!");
        db.ref('participantes/' + currentUserId).update({
            signed: true, sigData: sigPad.toDataURL(), photo: photo, time: new Date().toLocaleString()
        }).then(fecharModais);
    };

    function fecharModais() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        if(localStream) localStream.getTracks().forEach(t => t.stop());
    }

    document.getElementById('clearSig').onclick = () => sigPad.clear();

    document.getElementById('showQrBtn').onclick = () => {
        document.getElementById('qrcode').innerHTML = "";
        const link = window.location.href.split('?')[0] + "?modo=1";
        new QRCode(document.getElementById('qrcode'), { text: link, width: 200, height: 200 });
        document.getElementById('qrModal').style.display = 'flex';
    };

    function tentarRefazer(id, nome) {
        if(prompt("Senha Admin:") === ADMIN_PASSWORD) abrirAssinatura(id, nome);
    }
    function excluirParticipante(id, nome) {
        if(prompt(`Excluir ${nome}? Senha:`) === ADMIN_PASSWORD) db.ref('participantes/' + id).remove();
    }
    document.getElementById('clearAllBtn').onclick = () => {
        if(prompt("Limpar tudo? Senha:") === ADMIN_PASSWORD) db.ref('participantes').remove();
    };
    document.getElementById('generatePdf').onclick = () => {
        html2pdf().from(document.getElementById('mainTable')).save('frequencia.pdf');
    };
</script>
</body>
</html>
