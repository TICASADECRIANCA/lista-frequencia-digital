<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Frequência Digital Pro</title>
    <style>
        :root{--accent:#0b74e6; --danger:#ef4444; --success:#16a34a; --bg-light:#f5f7fb;}
        
        body {
            font-family: Inter, system-ui, sans-serif;
            margin: 0; padding: 10px; 
            background-color: var(--bg-light);
            overflow-x: hidden; /* Evita rolagem lateral da página inteira */ [cite: 3]
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            background: white; 
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); [cite: 5]
        }

        .header-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; } [cite: 6]
        .logo-escola { height: 40px; width: auto; } [cite: 7]
        h1 { margin: 0; font-size: 18px; color: #333; } [cite: 9]

        .controls { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; } [cite: 10]
        input, button { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; } [cite: 11]
        button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; } [cite: 12]
        button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
        button.danger { background: var(--danger); color: #fff; } [cite: 12]
        
        #searchInput { border: 2px solid var(--accent); flex-grow: 1; font-size: 15px; } [cite: 13]
        
        /* Ajuste da Tabela para não vazar da tela */
        .table-responsive { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 400px; } /* Min-width menor para caber em mais telas */ [cite: 14]
        th, td { padding: 6px 4px; border-bottom: 1px solid #eee; text-align: left; font-size: 12px; } [cite: 14]
        
        #tableBody tr { display: none; } [cite: 15]
        .mostrar-linha { display: table-row !important; } [cite: 16]

        .signed-thumb { height: 35px; border-radius: 4px; margin-right: 2px; } [cite: 19]
        
        /* Modal e Assinatura */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 1000; } [cite: 20]
        .card { background: #fff; padding: 15px; border-radius: 12px; width: 95%; max-width: 500px; max-height: 90vh; overflow-y: auto; } [cite: 21]
        
        .signature-wrapper { 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            background: #fafafa; 
            width: 100%; 
            height: 180px; 
            position: relative;
            touch-action: none; /* Crucial para não arrastar a tela ao assinar */ 
        }
        .signature-canvas { width: 100%; height: 100%; touch-action: none; } 
        
        #video, #photoPreview { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; } [cite: 29]

        body.modo-colaborador #adminPanel { display: none; } [cite: 34]

        @media (max-width: 600px) {
            h1 { font-size: 16px; } [cite: 40]
            td button { padding: 5px 8px; font-size: 11px; } /* Botão menor no celular */
        }
    </style>
</head>
<body id="mainBody">

<div class="container">
    <div class="header-container">
        <img src="logo.png" alt="Logo" class="logo-escola" onerror="this.style.display='none'">
        <h1 id="tituloPagina">Gestão de Frequência</h1> [cite: 55]
    </div>
    
    <div class="controls" id="adminPanel">
        <input id="nameInput" placeholder="Nome" style="flex:2"/>
        <input id="turmaInput" placeholder="Turma" style="flex:1"/>
        <button id="addBtn">Add</button>
        <button onclick="document.getElementById('importFile').click()" class="ghost">Importar</button>
        <input type="file" id="importFile" style="display:none" accept=".txt" />
        <button id="showQrBtn" class="ghost">QR</button>
        <button id="clearAllBtn" class="danger">Limpar</button>
        <div style="width:100%; display:flex; gap:5px; margin-top:5px; border-top:1px solid #eee; padding-top:5px;">
            <input id="pdfTurmaFilter" placeholder="Turma p/ PDF (ex: 7A)" style="flex:1"/>
            <button id="generatePdf" style="background:var(--success)">PDF por Turma</button> 
        </div>
    </div>

    <div class="controls">
        <input id="searchInput" type="text" placeholder="🔍 DIGITE SEU NOME..." onkeyup="filtrarTabela()"> [cite: 63]
    </div>

    <div class="table-responsive">
        <table id="mainTable">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Nome / Turma</th>
                    <th>Foto/Assin</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="signModal" class="modal">
    <div class="card">
        <h2 id="nomeAssinando" style="margin:0">Assinar</h2>
        <p id="geoStatus" style="font-size:10px; color:var(--warning)">Localizando...</p> [cite: 45]
        
        <label style="font-size:11px"><b>1. Selfie:</b></label>
        <video id="video" autoplay playsinline></video> [cite: 46]
        <img id="photoPreview" style="display:none;" />
        <button id="takePhoto" style="width:100%; margin: 5px 0">📸 Capturar</button> [cite: 47]

        <label style="font-size:11px"><b>2. Assinatura:</b></label>
        <div class="signature-wrapper">
            <canvas id="sigCanvas" class="signature-canvas"></canvas> [cite: 49]
        </div>
        <button id="clearSig" class="ghost" style="width:100%; margin-top:5px">LIMPAR ASSINATURA</button> [cite: 49]

        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button onclick="fecharModais()" class="ghost" style="flex:1">Sair</button>
            <button id="saveData" style="flex:2; background: var(--success)">CONFIRMAR</button> [cite: 50]
        </div>
    </div>
</div>

<div id="qrModal" class="modal">
    <div class="card" style="text-align:center; max-width: 300px;">
        <h3>QR Code de Acesso</h3>
        <div id="qrcode" style="display:flex; justify-content:center; margin:15px 0"></div>
        <button onclick="fecharModais()" class="ghost" style="width:100%">Fechar</button> [cite: 51]
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
    const ADMIN_PASSWORD = '1992';
    const firebaseConfig = {
        apiKey: "AIzaSyBy4gbEfmMgm-zgMmGq6h3oQ_-gQy2l2R0",
        authDomain: "frenquencia-digital.firebaseapp.com",
        databaseURL: "https://frenquencia-digital-default-rtdb.firebaseio.com",
        projectId: "frenquencia-digital",
        storageBucket: "frenquencia-digital.firebasestorage.app",
        messagingSenderId: "625078117212",
        appId: "1:625078117212:web:bc5c57e18af96b305d1799"
    }; [cite: 53]

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let sigPad, localStream, currentUserId = null;
    const urlParams = new URLSearchParams(window.location.search); [cite: 54]
    const eModoColaborador = urlParams.has('modo'); [cite: 54]

    if (eModoColaborador) {
        document.getElementById('mainBody').classList.add('modo-colaborador');
        document.getElementById('tituloPagina').innerText = "Presença Digital"; [cite: 55]
    }

    // Adicionar Manual
    document.getElementById('addBtn').onclick = () => {
        const n = document.getElementById('nameInput').value.trim();
        const t = document.getElementById('turmaInput').value.trim() || 'S/T';
        if(n) { 
            db.ref('participantes').push().set({ name: n, turma: t, signed: false }); [cite: 58]
            document.getElementById('nameInput').value = ''; document.getElementById('turmaInput').value = '';
        }
    };

    // Importar TXT (Formato: Nome, Turma)
    document.getElementById('importFile').onchange = (e) => {
        const file = e.target.files[0]; [cite: 59]
        const reader = new FileReader();
        reader.onload = (ev) => {
            const lines = ev.target.result.split(/\r?\n/); [cite: 60]
            lines.forEach(line => {
                const parts = line.split(','); [cite: 61]
                const name = parts[0]?.trim();
                const turma = parts[1]?.trim() || 'S/T';
                if (name) db.ref('participantes').push().set({ name: name, turma: turma, signed: false });
            });
            alert("Importado com sucesso!"); [cite: 62]
        };
        reader.readAsText(file);
    };

    function filtrarTabela() {
        const filter = document.getElementById("searchInput").value.toUpperCase(); [cite: 63]
        const tr = document.getElementById("tableBody").getElementsByTagName("tr"); [cite: 63]
        for (let i = 0; i < tr.length; i++) {
            const txtValue = tr[i].innerText.toUpperCase(); [cite: 65]
            if (eModoColaborador) {
                tr[i].classList.toggle('mostrar-linha', filter.length >= 2 && txtValue.indexOf(filter) > -1); [cite: 66]
            } else {
                tr[i].classList.toggle('mostrar-linha', filter === "" || txtValue.indexOf(filter) > -1); [cite: 67]
            }
        }
    }

    db.ref('participantes').on('value', (snapshot) => {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        const data = snapshot.val();
        if (data) {
            Object.keys(data).forEach(key => {
                const p = data[key]; [cite: 69]
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="status-badge ${p.signed ? 'status-assinado' : 'status-pendente'}">${p.signed ? 'Ok' : '...'}</span></td> [cite: 70]
                    <td><b>${p.name}</b><br><small>${p.turma || ''}</small></td>
                    <td>${p.signed ? `<img src="${p.sigData}" class="signed-thumb"><img src="${p.photo}" class="signed-thumb">` : '-'}</td> [cite: 70]
                    <td>
                        ${p.signed ? `<button class="ghost" onclick="tentarRefazer('${key}', '${p.name}')">Refazer</button>` : `<button onclick="abrirAssinatura('${key}', '${p.name}')">Assinar</button>`} [cite: 72]
                        ${!eModoColaborador ? `<button class="danger" onclick="excluirParticipante('${key}', '${p.name}')">X</button>` : ''} [cite: 73]
                    </td>
                `;
                tableBody.appendChild(tr); [cite: 74]
            });
            filtrarTabela();
        }
    });

    function abrirAssinatura(id, nome) {
        currentUserId = id; [cite: 79]
        document.getElementById('nomeAssinando').innerText = nome;
        document.getElementById('signModal').style.display = 'flex'; [cite: 79]
        setTimeout(() => {
            const canvas = document.getElementById('sigCanvas');
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            sigPad = new SignaturePad(canvas, { minWidth: 1.5, maxWidth: 3.5 });
        }, 300);
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => { [cite: 80]
            localStream = s;
            document.getElementById('video').srcObject = s;
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('video').style.display = 'block';
        });
    }

    document.getElementById('takePhoto').onclick = () => {
        const video = document.getElementById('video'); [cite: 83]
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width, 0); ctx.scale(-1, 1); [cite: 83]
        ctx.drawImage(video, 0, 0); [cite: 84]
        document.getElementById('photoPreview').src = canvas.toDataURL('image/jpeg');
        document.getElementById('photoPreview').style.display = 'block';
        document.getElementById('video').style.display = 'none';
    };

    document.getElementById('saveData').onclick = () => {
        const photo = document.getElementById('photoPreview').src; [cite: 86]
        if(sigPad.isEmpty() || !photo.startsWith('data')) return alert("Foto e Assinatura obrigatórias!");
        db.ref('participantes/' + currentUserId).update({
            signed: true, sigData: sigPad.toDataURL(), photo: photo, time: new Date().toLocaleString()
        }).then(fecharModais); [cite: 87]
    };

    function fecharModais() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); [cite: 88]
        if(localStream) localStream.getTracks().forEach(t => t.stop()); [cite: 88]
    }

    document.getElementById('clearSig').onclick = () => sigPad.clear(); [cite: 89]

    document.getElementById('showQrBtn').onclick = () => {
        document.getElementById('qrcode').innerHTML = "";
        const link = window.location.href.split('?')[0] + "?modo=1"; [cite: 89]
        new QRCode(document.getElementById('qrcode'), { text: link, width: 180, height: 180 }); [cite: 90]
        document.getElementById('qrModal').style.display = 'flex'; [cite: 90]
    };

    function tentarRefazer(id, nome) {
        if(prompt("Senha Admin:") === ADMIN_PASSWORD) abrirAssinatura(id, nome); [cite: 91]
    }
    function excluirParticipante(id, nome) {
        if(prompt(`Excluir ${nome}? Senha:`) === ADMIN_PASSWORD) db.ref('participantes/' + id).remove(); [cite: 92]
    }
    document.getElementById('clearAllBtn').onclick = () => {
        if(confirm("Deseja apagar TODO o banco de dados?") && prompt("Senha:") === ADMIN_PASSWORD) db.ref('participantes').remove(); [cite: 93]
    };

    // FUNÇÃO PARA GERAR PDF SEPARADO POR TURMA
    document.getElementById('generatePdf').onclick = () => {
        const turmaAlvo = document.getElementById('pdfTurmaFilter').value.trim().toUpperCase(); [cite: 94]
        const originalRows = Array.from(document.querySelectorAll('#tableBody tr'));
        
        // Criar uma tabela temporária para o PDF
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = `<h3>Relatório de Frequência - ${turmaAlvo || 'Geral'}</h3>`;
        const tempTable = document.createElement('table');
        tempTable.style.width = "100%";
        tempTable.border = "1";
        tempTable.innerHTML = "<thead><tr><th>Status</th><th>Nome</th><th>Turma</th><th>Assinatura</th><th>Foto</th></tr></thead>";
        const tempBody = document.createElement('tbody');

        originalRows.forEach(row => {
            const textoRow = row.innerText.toUpperCase();
            // Se o filtro estiver vazio, pega tudo. Se tiver algo, filtra pela turma.
            if (turmaAlvo === "" || textoRow.includes(turmaAlvo)) {
                const clone = row.cloneNode(true);
                // Remove a última coluna (botões de ação) do PDF
                clone.removeChild(clone.lastElementChild);
                tempBody.appendChild(clone);
            }
        });

        if (tempBody.children.length === 0) return alert("Nenhum aluno encontrado para esta turma.");

        tempTable.appendChild(tempBody);
        tempDiv.appendChild(tempTable);
        
        const opt = {
            margin: 10,
            filename: `frequencia_${turmaAlvo || 'geral'}.pdf`,
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };
        html2pdf().set(opt).from(tempDiv).save(); [cite: 94]
    };
</script>
</body>
</html>
