<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Lista de Frequência Digital</title>
    <style>
        :root{--accent:#0b74e6; --danger:#ef4444; --success:#16a34a; --warning:#f97316; --bg-light:#f5f7fb;}
        
        body {
            font-family: Inter, system-ui, sans-serif; 
            margin: 0; 
            padding: 8px; 
            background-image: url('fundo.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.94); 
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            box-sizing: border-box;
        }

        .header-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .logo-escola { height: 45px; width: auto; }
        h1 { margin: 0; font-size: 18px; color: #333; }

        .controls { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
        input, button { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px; }
        button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
        button.danger { background: var(--danger); }
        button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
        
        #searchInput { border: 2px solid var(--accent); flex-grow: 1; font-size: 14px; background: white; }

        .table-responsive { width: 100%; overflow-x: hidden; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; } 
        
        th, td { 
            padding: 8px 2px; 
            border-bottom: 1px solid #eee; 
            text-align: left; 
            font-size: 10px; 
            word-wrap: break-word; 
        }

        /* Larguras das colunas */
        .col-status { width: 60px; }
        .col-nome { width: auto; }
        .col-admin-reg { width: 70px; }
        .col-admin-gps { width: 90px; }
        .col-acao { width: 75px; }

        .status-txt { font-weight: bold; font-size: 9px; text-transform: uppercase; }
        .pendente { color: var(--danger); }
        .assinado { color: var(--success); }
        
        .signed-thumb { height: 30px; width: 30px; border-radius: 4px; border: 1px solid #ddd; object-fit: cover; }
        .geo-label { font-size: 8px; color: #666; display: block; line-height: 1.1; }

        /* MODAIS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 10px; }
        .card { background: #fff; padding: 15px; border-radius: 12px; width: 100%; max-width: 400px; box-sizing: border-box; }
        .signature-wrapper { border: 2px solid #333; border-radius: 8px; height: 160px; background: white; }
        #video, #photoPreview { width: 100%; border-radius: 8px; background: #000; }

        /* LÓGICA DE VISIBILIDADE */
        /* Quando NÃO tem "?modo=1" na URL, mostra tudo (Admin) */
        /* Quando TEM "?modo=1", oculta o que tem a classe .col-admin */
        body.modo-assinante #adminPanel, 
        body.modo-assinante .col-admin { 
            display: none !important; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <img src="logo.png" alt="Logo" class="logo-escola" onerror="this.style.display='none'">
        <h1>Frequência Digital</h1>
    </div>
    
    <div class="controls" id="adminPanel">
        <input id="nameInput" placeholder="Nome" style="flex:2;"/>
        <input id="turmaInput" placeholder="Turma" style="flex:1;"/>
        <button id="addBtn">Add</button>
        <button id="showQrBtn" class="ghost">QR</button>
        <button id="exportExcel" style="background:#1d6f42">XLS</button>
        <button id="clearAllBtn" class="danger">Limpar</button>
    </div>

    <div class="controls">
        <input id="searchInput" type="text" placeholder="🔍 BUSCAR MEU NOME..." onkeyup="filtrarTabela()">
    </div>

    <div class="table-responsive">
        <table id="mainTable">
            <thead>
                <tr>
                    <th class="col-status">Status</th>
                    <th class="col-nome">Nome/Turma</th>
                    <th class="col-admin col-admin-reg">Fotos</th>
                    <th class="col-admin col-admin-gps">Endereço GPS</th>
                    <th class="col-acao">Ação</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="qrModal" class="modal">
    <div class="card" style="text-align:center;">
        <h3>QR Code para Alunos</h3>
        <div id="qrcode" style="display:flex; justify-content:center; margin:15px 0"></div>
        <button onclick="fecharModais()" class="ghost" style="width:100%">Fechar</button>
    </div>
</div>

<div id="signModal" class="modal">
    <div class="card">
        <h3 id="nomeAssinando" style="margin:0">Assinar Presença</h3>
        <p id="geoStatus" style="font-size:10px; color:var(--warning)">📍 Validando localização...</p>
        <video id="video" autoplay playsinline></video>
        <img id="photoPreview" style="display:none;" />
        <button id="takePhoto" style="width:100%; margin: 5px 0; background:#333">📸 Tirar Foto</button>
        <div class="signature-wrapper"><canvas id="sigCanvas" style="width:100%;height:100%"></canvas></div>
        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button onclick="fecharModais()" style="background:#ccc; flex:1">Sair</button>
            <button id="saveData" style="flex:2; background: var(--success)">FINALIZAR</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
    const ADMIN_PASSWORD = '1992';
    const firebaseConfig = {
        apiKey: "AIzaSyBy4gbEfmMgm-zgMmGq6h3oQ_-gQy2l2R0",
        databaseURL: "https://frenquencia-digital-default-rtdb.firebaseio.com",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let sigPad, localStream, currentUserId = null, addressReal = "Buscando...";

    // Detecta o modo através da URL
    const urlParams = new URLSearchParams(window.location.search);
    const modoAssinante = urlParams.has('modo');
    if (modoAssinante) document.body.classList.add('modo-assinante');

    function filtrarTabela() {
        const filter = document.getElementById("searchInput").value.toUpperCase();
        const tr = document.getElementById("tableBody").getElementsByTagName("tr");
        for (let i = 0; i < tr.length; i++) {
            const txt = tr[i].innerText.toUpperCase();
            // No modo assinante, só mostra se digitar pelo menos 3 letras
            tr[i].style.display = (modoAssinante ? (filter.length >= 3 && txt.indexOf(filter) > -1) : (filter === "" || txt.indexOf(filter) > -1)) ? "" : "none";
        }
    }

    db.ref('participantes').on('value', (snapshot) => {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        const data = snapshot.val();
        if (data) Object.keys(data).forEach(key => {
            const p = data[key];
            const tr = document.createElement('tr');
            const statusTxt = p.signed ? '<span class="status-txt assinado">Assinado</span>' : '<span class="status-txt pendente">Pendente</span>';
            
            tr.innerHTML = `
                <td class="col-status">${statusTxt}</td>
                <td class="col-nome"><b>${p.name}</b><br><small>${p.turma || 'S/T'}</small></td>
                <td class="col-admin col-admin-reg">${p.signed ? `<img src="${p.sigData}" class="signed-thumb"><img src="${p.photo}" class="signed-thumb">` : '-'}</td>
                <td class="col-admin col-admin-gps"><span class="geo-label">${p.geo || '-'}</span></td>
                <td class="col-acao" style="display:flex; gap:2px">
                    ${p.signed ? `<button onclick="tentarRefazer('${key}','${p.name}')">Ref.</button>` : `<button onclick="abrirAssinatura('${key}','${p.name}')">OK</button>`}
                    ${!modoAssinante ? `<button class="danger" onclick="excluir('${key}','${p.name}')">X</button>` : ''}
                </td>
            `;
            tableBody.appendChild(tr);
        });
        filtrarTabela();
    });

    function abrirAssinatura(id, nome) {
        currentUserId = id;
        document.getElementById('nomeAssinando').innerText = nome;
        document.getElementById('signModal').style.display = 'flex';
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
                .then(r => r.json()).then(d => {
                    addressReal = d.address.road ? (d.address.road + ", " + (d.address.house_number || "S/N")) : d.display_name;
                    document.getElementById('geoStatus').innerText = "📍 Localização Confirmada";
                });
            });
        }
        setTimeout(() => {
            const canvas = document.querySelector("#sigCanvas");
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            sigPad = new SignaturePad(canvas);
        }, 300);
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => {
            localStream = s;
            document.getElementById('video').srcObject = s;
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('video').style.display = 'block';
        });
    }

    document.getElementById('takePhoto').onclick = () => {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        document.getElementById('photoPreview').src = canvas.toDataURL('image/jpeg');
        document.getElementById('photoPreview').style.display = 'block';
        document.getElementById('video').style.display = 'none';
    };

    document.getElementById('saveData').onclick = () => {
        const photo = document.getElementById('photoPreview').src;
        if(sigPad.isEmpty() || !photo.startsWith('data')) return alert("Obrigatório: Foto e Assinatura!");
        db.ref('participantes/' + currentUserId).update({
            signed: true, sigData: sigPad.toDataURL(), photo: photo, 
            time: new Date().toLocaleString(), geo: addressReal
        }).then(() => { 
            fecharModais(); 
            document.getElementById('searchInput').value = ""; // Limpa a busca após assinar
            filtrarTabela();
        });
    };

    function fecharModais() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        if(localStream) localStream.getTracks().forEach(t => t.stop());
    }

    function excluir(id, n) { if(prompt(`Senha para excluir ${n}:`) === ADMIN_PASSWORD) db.ref('participantes/' + id).remove(); }
    function tentarRefazer(id, n) { if(prompt("Senha para REFAZER:") === ADMIN_PASSWORD) abrirAssinatura(id, n); }

    document.getElementById('addBtn').onclick = () => {
        const n = document.getElementById('nameInput').value;
        const t = document.getElementById('turmaInput').value;
        if(n) db.ref('participantes').push().set({ name: n, turma: t, signed: false });
    };

    document.getElementById('showQrBtn').onclick = () => {
        document.getElementById('qrcode').innerHTML = "";
        const urlAlunos = window.location.href.split('?')[0] + "?modo=1";
        new QRCode(document.getElementById('qrcode'), { text: urlAlunos, width: 180, height: 180 });
        document.getElementById('qrModal').style.display = 'flex';
    };

    document.getElementById('clearAllBtn').onclick = () => { if(prompt("Senha:") === ADMIN_PASSWORD) db.ref('participantes').remove(); };
    
    document.getElementById('exportExcel').onclick = () => {
        db.ref('participantes').once('value', (snapshot) => {
            const rows = [["Status", "Nome", "Turma", "Data/Hora", "Endereço"]];
            const data = snapshot.val();
            if (data) Object.keys(data).forEach(k => {
                const p = data[k];
                rows.push([p.signed ? "Assinado" : "Pendente", p.name, p.turma || "S/T", p.time || "-", p.geo || "-"]);
            });
            const ws = XLSX.utils.aoa_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Frequencia");
            XLSX.writeFile(wb, "relatorio_frequencia.xlsx");
        });
    };
</script>
</body>
</html>
