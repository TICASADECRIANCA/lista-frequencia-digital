<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Frequência Digital Pro</title>
    <style>
        :root{--accent:#0b74e6; --danger:#ef4444; --success:#16a34a; --bg-light:#f5f7fb;}
        
        body {
            font-family: Inter, system-ui, sans-serif;
            margin: 0; padding: 10px; 
            background-color: var(--bg-light);
            overflow-x: hidden;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            background: white; 
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .header-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .logo-escola { height: 40px; width: auto; }
        h1 { margin: 0; font-size: 18px; color: #333; }

        .controls { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        input, button { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; }
        button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
        button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
        button.danger { background: var(--danger); color: #fff; }
        
        #searchInput { border: 2px solid var(--accent); flex-grow: 1; font-size: 15px; }
        
        .table-responsive { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; min-width: 350px; }
        th, td { padding: 6px 4px; border-bottom: 1px solid #eee; text-align: left; font-size: 12px; }
        
        #tableBody tr { display: none; }
        .mostrar-linha { display: table-row !important; }

        .signed-thumb { height: 35px; border-radius: 4px; margin-right: 2px; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .card { background: #fff; padding: 15px; border-radius: 12px; width: 95%; max-width: 450px; max-height: 95vh; overflow-y: auto; }
        
        .signature-wrapper { 
            border: 2px solid #333; 
            border-radius: 8px; 
            background: #fff; 
            width: 100%; 
            height: 180px; 
            touch-action: none;
        }
        .signature-canvas { width: 100%; height: 100%; touch-action: none; }
        
        #video, #photoPreview { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: #000; }

        body.modo-colaborador #adminPanel { display: none; }
    </style>
</head>
<body id="mainBody">

<div class="container">
    <div class="header-container">
        <img src="logo.png" alt="Logo" class="logo-escola" onerror="this.style.display='none'">
        <h1>Frequência Escolar</h1>
    </div>
    
    <div class="controls" id="adminPanel">
        <input id="nameInput" placeholder="Nome Aluno" style="flex:2"/>
        <input id="turmaInput" placeholder="Turma" style="flex:1"/>
        <button id="addBtn">Add</button>
        <button onclick="document.getElementById('importFile').click()" class="ghost">Importar TXT</button>
        <input type="file" id="importFile" style="display:none" accept=".txt" />
        <button id="showQrBtn" class="ghost">Gerar QR</button>
        <button id="clearAllBtn" class="danger">Limpar Tudo</button>
        <div style="width:100%; display:flex; gap:5px; margin-top:5px; border-top:1px solid #eee; padding-top:5px;">
            <input id="pdfTurmaFilter" placeholder="Filtrar Turma para PDF" style="flex:1"/>
            <button id="generatePdf" style="background:var(--success)">Baixar PDF</button>
        </div>
    </div>

    <div class="controls">
        <input id="searchInput" type="text" placeholder="🔍 DIGITE SEU NOME PARA ASSINAR..." onkeyup="filtrarTabela()">
    </div>

    <div class="table-responsive">
        <table id="mainTable">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Nome / Turma</th>
                    <th class="admin-only">Registros</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="signModal" class="modal">
    <div class="card">
        <h3 id="nomeAssinando" style="margin-top:0">Assinar Presença</h3>
        
        <label style="font-size:11px"><b>1. Selfie:</b></label>
        <video id="video" autoplay playsinline></video>
        <img id="photoPreview" style="display:none;" />
        <button id="takePhoto" style="width:100%; margin: 5px 0">📸 Tirar Foto</button>

        <label style="font-size:11px"><b>2. Assinatura:</b></label>
        <div class="signature-wrapper">
            <canvas id="sigCanvas" class="signature-canvas"></canvas>
        </div>
        <button id="clearSig" class="ghost" style="width:100%; margin-top:5px; font-size:11px">ERREI, LIMPAR ASSINATURA</button>

        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button onclick="fecharModais()" class="ghost" style="flex:1">Cancelar</button>
            <button id="saveData" style="flex:2; background: var(--success)">FINALIZAR AGORA</button>
        </div>
    </div>
</div>

<div id="qrModal" class="modal">
    <div class="card" style="text-align:center; max-width: 300px;">
        <h3>Acesso pelo Celular</h3>
        <div id="qrcode" style="display:flex; justify-content:center; margin:15px 0"></div>
        <button onclick="fecharModais()" class="ghost" style="width:100%">Fechar</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
    const ADMIN_PASSWORD = '1992';
    const firebaseConfig = {
        apiKey: "AIzaSyBy4gbEfmMgm-zgMmGq6h3oQ_-gQy2l2R0",
        authDomain: "frenquencia-digital.firebaseapp.com",
        databaseURL: "https://frenquencia-digital-default-rtdb.firebaseio.com",
        projectId: "frenquencia-digital",
        storageBucket: "frenquencia-digital.firebasestorage.app",
        messagingSenderId: "625078117212",
        appId: "1:625078117212:web:bc5c57e18af96b305d1799"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let sigPad, localStream, currentUserId = null;
    const urlParams = new URLSearchParams(window.location.search);
    const eModoColaborador = urlParams.has('modo');

    if (eModoColaborador) document.body.classList.add('modo-colaborador');

    function filtrarTabela() {
        const filter = document.getElementById("searchInput").value.toUpperCase();
        const tr = document.getElementById("tableBody").getElementsByTagName("tr");
        for (let i = 0; i < tr.length; i++) {
            const txtValue = tr[i].innerText.toUpperCase();
            if (eModoColaborador) {
                // Segurança: só mostra se digitar 3 letras ou mais
                tr[i].classList.toggle('mostrar-linha', filter.length >= 3 && txtValue.indexOf(filter) > -1);
            } else {
                tr[i].classList.toggle('mostrar-linha', filter === "" || txtValue.indexOf(filter) > -1);
            }
        }
    }

    db.ref('participantes').on('value', (snapshot) => {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        const data = snapshot.val();
        if (data) {
            Object.keys(data).forEach(key => {
                const p = data[key];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="status-badge ${p.signed ? 'status-assinado' : 'status-pendente'}">${p.signed ? '✅' : '❌'}</span></td>
                    <td><b>${p.name}</b><br><small>${p.turma || 'Sem Turma'}</small></td>
                    <td>${p.signed ? `<img src="${p.sigData}" class="signed-thumb"><img src="${p.photo}" class="signed-thumb">` : '-'}</td>
                    <td>
                        ${p.signed ? `<button class="ghost" onclick="tentarRefazer('${key}', '${p.name}')">Refazer</button>` : `<button onclick="abrirAssinatura('${key}', '${p.name}')">ASSINAR</button>`}
                    </td>
                `;
                tableBody.appendChild(tr);
            });
            filtrarTabela();
        }
    });

    function abrirAssinatura(id, nome) {
        currentUserId = id;
        document.getElementById('nomeAssinando').innerText = nome;
        document.getElementById('signModal').style.display = 'flex';
        setTimeout(() => {
            const canvas = document.getElementById('sigCanvas');
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            sigPad = new SignaturePad(canvas, { minWidth: 1.5, maxWidth: 3.5 });
        }, 300);
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => {
            localStream = s;
            document.getElementById('video').srcObject = s;
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('video').style.display = 'block';
        });
    }

    document.getElementById('takePhoto').onclick = () => {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0);
        document.getElementById('photoPreview').src = canvas.toDataURL('image/jpeg');
        document.getElementById('photoPreview').style.display = 'block';
        document.getElementById('video').style.display = 'none';
    };

    // --- LÓGICA DE ENCERRAMENTO DE SESSÃO ---
    document.getElementById('saveData').onclick = () => {
        const photo = document.getElementById('photoPreview').src;
        if(sigPad.isEmpty() || !photo.startsWith('data')) return alert("Capture a foto e a assinatura!");
        
        db.ref('participantes/' + currentUserId).update({
            signed: true, 
            sigData: sigPad.toDataURL(), 
            photo: photo, 
            time: new Date().toLocaleString()
        }).then(() => {
            alert("Presença confirmada com sucesso!");
            fecharModais();
            // RESET DA SESSÃO:
            document.getElementById('searchInput').value = ""; // Limpa a busca
            filtrarTabela(); // Esconde as linhas novamente
            window.scrollTo(0, 0); // Volta para o topo
        });
    };

    function fecharModais() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        if(sigPad) sigPad.clear();
    }

    document.getElementById('clearSig').onclick = () => sigPad.clear();

    document.getElementById('showQrBtn').onclick = () => {
        document.getElementById('qrcode').innerHTML = "";
        const link = window.location.href.split('?')[0] + "?modo=1";
        new QRCode(document.getElementById('qrcode'), { text: link, width: 180, height: 180 });
        document.getElementById('qrModal').style.display = 'flex';
    };

    // Admin Functions
    function tentarRefazer(id, nome) { if(prompt("Senha Admin:") === ADMIN_PASSWORD) abrirAssinatura(id, nome); }
    document.getElementById('addBtn').onclick = () => {
        const n = document.getElementById('nameInput').value;
        const t = document.getElementById('turmaInput').value;
        if(n) db.ref('participantes').push().set({ name: n, turma: t, signed: false });
    };

    document.getElementById('generatePdf').onclick = () => {
        const turma = document.getElementById('pdfTurmaFilter').value.toUpperCase();
        const content = document.getElementById('mainTable').cloneNode(true);
        // Remover última coluna de cada linha no clone para o PDF
        content.querySelectorAll('tr').forEach(tr => tr.lastElementChild.remove());
        
        const opt = { margin: 10, filename: `frequencia_${turma||'geral'}.pdf`, jsPDF: { orientation: 'landscape' } };
        html2pdf().set(opt).from(content).save();
    };
</script>
</body>
</html>
