<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Frequência Digital</title>
    <style>
        :root{--accent:#0b74e6; --danger:#ef4444; --success:#16a34a; --warning:#f97316; --bg-light:#f5f7fb;}
        
        body {
            font-family: Inter, system-ui, sans-serif; 
            margin: 0; padding: 8px; 
            background-image: url('fundo.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%; margin: 0 auto;
            background: rgba(255, 255, 255, 0.94); 
            padding: 12px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px); box-sizing: border-box;
        }

        .header-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .logo-escola { height: 45px; width: auto; }
        h1 { margin: 0; font-size: 18px; color: #333; }

        .controls { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
        input, button { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px; }
        button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
        button.danger { background: var(--danger); }
        button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
        
        #searchInput { border: 2px solid var(--accent); flex-grow: 1; font-size: 14px; background: white; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; } 
        
        th, td { 
            padding: 8px 4px; border-bottom: 1px solid #eee; 
            text-align: left; font-size: 14px; vertical-align: middle;
        }

        .col-nome { min-width: 150px; }
        .col-status { width: 70px; }
        .col-admin { width: 80px; }
        .col-acao { width: 95px; text-align: center; }

        .status-txt { font-weight: bold; font-size: 9px; text-transform: uppercase; }
        .pendente { color: var(--danger); }
        .assinado { color: var(--success); }
        
        .signed-thumb { height: 32px; width: 32px; border-radius: 4px; border: 1px solid #ddd; object-fit: cover; cursor: pointer; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 10px; }
        .card { background: #fff; padding: 12px; border-radius: 12px; width: 100%; max-width: 400px; box-sizing: border-box; max-height: 95vh; overflow-y: auto; }
        
        #video, #photoPreview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; background: #000; }
        .signature-wrapper { border: 2px solid #333; border-radius: 8px; height: 130px; background: white; margin-top: 5px; }

        #successToast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--success); color: white; padding: 20px; border-radius: 50px;
            z-index: 2000; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        body.modo-assinante #adminPanel, body.modo-assinante .col-admin { display: none !important; }

        #initialOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .popup-entry { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 350px; }
        
        /* ESTILOS DA PERGUNTA OBRIGATÓRIA */
        .auth-container {
            background: #fffbeb; border: 2px solid #fde68a;
            padding: 10px; border-radius: 10px; margin: 10px 0; text-align: center;
        }
        .auth-question { font-size: 13px; color: #92400e; font-weight: bold; margin-bottom: 8px; display: block; }
        .auth-buttons { display: flex; gap: 8px; }
        .btn-auth {
            flex: 1; padding: 10px; border: 2px solid #ddd;
            background: white; color: #666; border-radius: 8px; font-weight: bold;
        }
        .btn-auth.active-sim { background: var(--success); color: white; border-color: #15803d; }
        .btn-auth.active-nao { background: var(--danger); color: white; border-color: #b91c1c; }
    </style>
</head>
<body>

<div id="viewModal" class="modal" onclick="this.style.display='none'">
    <img id="fullImage" src="" style="max-width:95%; border:3px solid white;">
</div>

<div id="initialOverlay">
    <div class="popup-entry">
        <h2>Frequência Digital</h2>
        <button class="btn-auth active-sim" style="width:100%; margin-bottom:10px; padding:15px" onclick="escolherAcesso('aluno')">ASSINAR LISTA</button>
        <button class="btn-auth" style="width:100%" onclick="escolherAcesso('admin')">ADMINISTRAÇÃO</button>
    </div>
</div>

<div id="appContent">
    <div id="successToast">✅ ASSINATURA CONCLUÍDA!</div>
    <div class="container">
        <div class="header-container">
            <h1>Lista de Presença</h1>
            <button onclick="location.reload()" style="margin-left:auto; background:#eee; color:#333;">Sair</button>
        </div>
        
        <div class="controls" id="adminPanel">
            <input id="nameInput" placeholder="Nome" style="flex:2;"/>
            <input id="turmaInput" placeholder="Turma" style="flex:1;"/>
            <button id="addBtn">Add</button>
            <button id="exportExcel" style="background:#1d6f42">Excel</button>
            <button id="btnOpenPdfModal" style="background:#e11d48">PDF</button>
            <button id="clearAllBtn" class="danger">Limpar</button>
        </div>

        <input id="searchInput" type="text" placeholder="🔍 BUSCAR NOME..." onkeyup="filtrarTabela()">

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Nome/Turma</th>
                        <th class="col-admin">Fotos</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="signModal" class="modal">
    <div class="card">
        <h3 id="nomeAssinando">Assinar</h3>
        
        <div class="auth-container">
            <span class="auth-question">Autoriza a participação do aluno nos eventos do 1º ano?</span>
            <div class="auth-buttons">
                <button type="button" id="btnSim" class="btn-auth" onclick="setAutorizacao(true)">SIM</button>
                <button type="button" id="btnNao" class="btn-auth" onclick="setAutorizacao(false)">NÃO</button>
            </div>
        </div>

        <p id="geoStatus" style="font-size:10px; color:gray;">📍 Buscando GPS...</p>
        <video id="video" autoplay playsinline></video>
        <img id="photoPreview" style="display:none;" />
        
        <button id="takePhoto" style="width:100%; margin: 5px 0; background:#333;">📸 TIRAR FOTO</button>
        <div class="signature-wrapper"><canvas id="sigCanvas"></canvas></div>
        
        <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button onclick="fecharModais()" style="background:#ccc; flex:1">Sair</button>
            <button id="saveData" style="flex:2; background: var(--success);">CONFIRMAR</button>
        </div>
    </div>
</div>

<div id="pdfModal" class="modal">
    <div class="card" style="text-align:center;">
        <h3>Exportar PDF</h3>
        <button style="width:100%; margin:5px 0; padding:12px; background:var(--accent)" onclick="gerarPdfRelatorio('todos')">Todos</button>
        <button style="width:100%; margin:5px 0; padding:12px; background:var(--success)" onclick="gerarPdfRelatorio('assinados')">Apenas Assinados</button>
        <button onclick="fecharModais()" class="ghost" style="width:100%">Cancelar</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBy4gbEfmMgm-zgMmGq6h3oQ_-gQy2l2R0", databaseURL: "https://frenquencia-digital-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let sigPad, localStream, currentUserId = null, addressReal = "N/A", autorizacaoStatus = null;

    function escolherAcesso(tipo) {
        if (tipo === 'aluno') {
            document.body.classList.add('modo-assinante');
            document.getElementById('initialOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
        } else {
            if (prompt("Senha Admin:") === 'frequencia1992') {
                document.getElementById('initialOverlay').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
            }
        }
    }

    function setAutorizacao(val) {
        autorizacaoStatus = val ? "SIM" : "NÃO";
        document.getElementById('btnSim').classList.toggle('active-sim', val);
        document.getElementById('btnNao').classList.toggle('active-nao', !val);
    }

    function filtrarTabela() {
        const filter = document.getElementById("searchInput").value.toUpperCase();
        const tr = document.getElementById("tableBody").getElementsByTagName("tr");
        const modoAssinante = document.body.classList.contains('modo-assinante');
        for (let i = 0; i < tr.length; i++) {
            const isSigned = tr[i].getAttribute('data-signed') === 'true';
            const txt = tr[i].innerText.toUpperCase();
            if (modoAssinante) {
                tr[i].style.display = (filter.length >= 3 && txt.indexOf(filter) > -1 && !isSigned) ? "" : "none";
            } else {
                tr[i].style.display = (filter === "" || txt.indexOf(filter) > -1) ? "" : "none";
            }
        }
    }

    db.ref('participantes').on('value', (snap) => {
        const body = document.getElementById('tableBody'); body.innerHTML = '';
        const data = snap.val();
        if (data) Object.keys(data).forEach(key => {
            const p = data[key];
            const tr = document.createElement('tr');
            tr.setAttribute('data-signed', p.signed);
            tr.innerHTML = `
                <td>${p.signed ? '<b class="assinado">OK</b>' : '<b class="pendente">...</b>'}</td>
                <td><b>${p.name}</b><br><small>${p.turma || ''}</small></td>
                <td class="col-admin">${p.signed ? `<img src="${p.photo}" class="signed-thumb" onclick="ver('${p.photo}')">` : '-'}</td>
                <td><button onclick="abrirAssinatura('${key}','${p.name}')">${p.signed ? 'Refazer' : 'Assinar'}</button></td>
            `;
            body.appendChild(tr);
        });
    });

    function ver(src) { document.getElementById('fullImage').src = src; document.getElementById('viewModal').style.display = 'flex'; }

    function abrirAssinatura(id, nome) {
        currentUserId = id; autorizacaoStatus = null;
        document.getElementById('nomeAssinando').innerText = nome;
        document.getElementById('btnSim').className = 'btn-auth';
        document.getElementById('btnNao').className = 'btn-auth';
        document.getElementById('signModal').style.display = 'flex';
        
        navigator.geolocation.getCurrentPosition(pos => {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
            .then(r => r.json()).then(d => addressReal = d.display_name);
        });

        navigator.mediaDevices.getUserMedia({ video: true }).then(s => {
            localStream = s; document.getElementById('video').srcObject = s;
            document.getElementById('video').style.display = 'block';
            document.getElementById('photoPreview').style.display = 'none';
        });

        setTimeout(() => {
            const cv = document.getElementById("sigCanvas");
            cv.width = cv.offsetWidth; cv.height = cv.offsetHeight;
            sigPad = new SignaturePad(cv);
        }, 500);
    }

    document.getElementById('takePhoto').onclick = () => {
        const v = document.getElementById('video');
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        document.getElementById('photoPreview').src = c.toDataURL('image/jpeg');
        document.getElementById('photoPreview').style.display = 'block';
        v.style.display = 'none';
    };

    document.getElementById('saveData').onclick = () => {
        if (!autorizacaoStatus) return alert("Por favor, responda se AUTORIZA ou NÃO a participação.");
        const photo = document.getElementById('photoPreview').src;
        if (sigPad.isEmpty() || !photo.startsWith('data')) return alert("Foto e assinatura obrigatórias.");

        db.ref('participantes/' + currentUserId).update({
            signed: true, photo: photo, sigData: sigPad.toDataURL(),
            time: new Date().toLocaleString(), geo: addressReal,
            autorizado: autorizacaoStatus
        }).then(() => {
            fecharModais();
            document.getElementById('successToast').style.display = 'block';
            setTimeout(() => document.getElementById('successToast').style.display = 'none', 2000);
        });
    };

    function fecharModais() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        if (localStream) localStream.getTracks().forEach(t => t.stop());
    }

    document.getElementById('addBtn').onclick = () => {
        const n = document.getElementById('nameInput').value;
        const t = document.getElementById('turmaInput').value;
        if(n) db.ref('participantes').push().set({ name: n, turma: t, signed: false });
    };

    document.getElementById('exportExcel').onclick = async () => {
        const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('Lista');
        ws.columns = [
            {header:'NOME', key:'name', width:30}, {header:'TURMA', key:'turma', width:10},
            {header:'AUTORIZADO', key:'auth', width:15}, {header:'DATA', key:'time', width:20}
        ];
        db.ref('participantes').once('value', snap => {
            const data = snap.val();
            for(let k in data) {
                const p = data[k];
                ws.addRow({name: p.name, turma: p.turma, auth: p.autorizado || 'Pendente', time: p.time || '-'});
            }
            wb.xlsx.writeBuffer().then(b => saveAs(new Blob([b]), "relatorio.xlsx"));
        });
    };

    document.getElementById('btnOpenPdfModal').onclick = () => document.getElementById('pdfModal').style.display='flex';

    async function gerarPdfRelatorio(filtro) {
        const { jsPDF } = window.jspdf; const doc = new jsPDF();
        db.ref('participantes').once('value', snap => {
            const data = Object.values(snap.val() || {});
            const final = data.filter(p => filtro === 'assinados' ? p.signed : true);
            const rows = final.map(p => [p.name, p.turma || '-', p.autorizado || 'Não Resp.', p.time || '-']);
            doc.autoTable({ head: [['Nome', 'Turma', 'Autoriz.', 'Data/Hora']], body: rows });
            doc.save("lista.pdf");
            fecharModais();
        });
    }
</script>
</body>
</html>
