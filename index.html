<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Frequência Digital</title>
    <style>
        :root{--accent:#0b74e6; --danger:#ef4444; --success:#16a34a; --warning:#f97316; --bg-light:#f5f7fb;}
        
        body {
            font-family: Inter, system-ui, sans-serif; 
            margin: 0; padding: 8px; 
            background-image: url('fundo.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%; margin: 0 auto;
            background: rgba(255, 255, 255, 0.94); 
            padding: 12px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px); box-sizing: border-box;
        }

        .header-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        h1 { margin: 0; font-size: 18px; color: #333; }

        .controls { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
        input, button { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px; }
        button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
        button.danger { background: var(--danger); }
        
        #searchInput { border: 2px solid var(--accent); flex-grow: 1; font-size: 14px; background: white; padding: 10px; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; } 
        
        th, td { 
            padding: 8px 4px; border-bottom: 1px solid #eee; 
            text-align: left; font-size: 14px; vertical-align: middle;
        }

        .col-nome { min-width: 150px; }
        .col-status { width: 70px; }
        .col-admin-reg { width: 75px; }
        .col-admin-gps { width: 110px; }
        .col-acao { width: 105px; text-align: center; }

        .btn-group { display: flex; gap: 4px; justify-content: center; }
        .status-txt { font-weight: bold; font-size: 9px; text-transform: uppercase; }
        .pendente { color: var(--danger); }
        .assinado { color: var(--success); }
        
        .signed-thumb { height: 32px; width: 32px; border-radius: 4px; border: 1px solid #ddd; object-fit: cover; cursor: pointer; }
        .geo-label { font-size: 8px; color: #666; display: block; line-height: 1.1; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 10px; }
        .card { background: #fff; padding: 12px; border-radius: 12px; width: 100%; max-width: 400px; box-sizing: border-box; max-height: 95vh; overflow-y: auto; }
        
        #video, #photoPreview { width: 100%; max-height: 230px; object-fit: cover; border-radius: 8px; background: #000; }
        .signature-wrapper { border: 2px solid #333; border-radius: 8px; height: 140px; background: white; margin-top: 5px; }

        #successToast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--success); color: white; padding: 20px 40px; border-radius: 50px;
            font-weight: bold; font-size: 18px; z-index: 2000; display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center;
        }

        /* REGRAS DE VISIBILIDADE ORIGINAL */
        body.modo-assinante #adminPanel, body.modo-assinante .col-admin { display: none !important; }

        #initialOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
        .popup-entry { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 350px; }
        .btn-entry-aluno { background: var(--success); color: white; border: none; width: 100%; padding: 18px; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; margin-bottom: 12px; }

        .auth-container {
            background: #f8fafc; border: 1px solid #e2e8f0;
            padding: 12px; border-radius: 10px; margin: 10px 0; text-align: center;
        }
        .auth-question { font-size: 13px; color: #334155; font-weight: 600; margin-bottom: 10px; display: block; line-height: 1.4; }
        .auth-buttons { display: flex; gap: 10px; justify-content: center; }
        .btn-auth {
            flex: 1; padding: 10px; border: 2px solid #cbd5e1;
            background: white; color: #64748b; border-radius: 8px; font-weight: bold;
        }
        .btn-auth.active-sim { background: var(--success); color: white; border-color: #15803d; }
        .btn-auth.active-nao { background: var(--danger); color: white; border-color: #b91c1c; }
    </style>
</head>
<body>

<div id="viewModal" class="modal" onclick="this.style.display='none'">
    <img id="fullImage" src="" style="max-width:95%; border:3px solid white; border-radius:8px;">
</div>

<div id="initialOverlay">
    <div class="popup-entry">
        <h2 style="margin-top:0">Bem-vindo</h2>
        <button class="btn-entry-aluno" onclick="escolherAcesso('aluno')">Assinar Lista</button>
        <button class="btn-auth" style="width:100%; border:1px solid #ccc; padding:10px; border-radius:8px" onclick="escolherAcesso('admin')">Acesso Admin</button>
    </div>
</div>

<div id="appContent" style="display:none;">
    <div id="successToast">✅ ASSINATURA CONCLUÍDA!</div>
    <div class="container">
        <div class="header-container">
            <h1>Frequência Digital</h1>
            <button onclick="location.reload()" style="margin-left:auto; background:#ddd; color:#333; padding:4px 8px; font-size:10px">Sair</button>
        </div>
        
        <div class="controls" id="adminPanel">
            <input id="nameInput" placeholder="Nome" style="flex:2;"/>
            <input id="turmaInput" placeholder="Turma" style="flex:1;"/>
            <button id="addBtn">Add</button>
            <button id="exportExcel" style="background:#1d6f42">Excel</button>
            <button id="btnOpenPdfModal" style="background:#e11d48">PDF</button>
            <button id="clearAllBtn" class="danger">Limpar Tudo</button>
        </div>

        <div class="controls">
            <input id="searchInput" type="text" placeholder="🔍 PESQUISE SEU NOME..." oninput="filtrarTabela()">
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th class="col-status">Status</th>
                        <th class="col-nome">Nome/Turma</th>
                        <th class="col-admin col-admin-reg">Fotos</th>
                        <th class="col-admin col-admin-gps">GPS</th>
                        <th class="col-acao">Ação</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="signModal" class="modal">
    <div class="card">
        <h3 id="nomeAssinando" style="margin:0">Assinar</h3>
        <div class="auth-container">
            <span class="auth-question">Autorizo a participação do meu filho(a) nos eventos?</span>
            <div class="auth-buttons">
                <button type="button" id="btnSim" class="btn-auth" onclick="setAutorizacao(true)">SIM</button>
                <button type="button" id="btnNao" class="btn-auth" onclick="setAutorizacao(false)">NÃO</button>
            </div>
        </div>
        <p id="geoStatus" style="font-size:10px; color:var(--warning); font-weight: bold;">📍 Validando GPS...</p>
        <video id="video" autoplay playsinline></video>
        <img id="photoPreview" style="display:none;" />
        <button id="takePhoto" style="width:100%; margin: 5px 0; background:#333; padding: 12px; font-weight: bold;">📸 TIRAR FOTO </button>
        <button id="clearMedia" onclick="resetMedia()" style="width:100%; margin-bottom: 5px; background:var(--warning); color:white; border:none; padding: 6px; border-radius: 6px;">🔄 REFAZER FOTO</button>
        <div class="signature-wrapper"><canvas id="sigCanvas"></canvas></div>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button onclick="fecharModais()" style="background:#ccc; flex:1">Sair</button>
            <button id="saveData" style="flex:2; background: var(--success); font-weight:bold;">CONFIRMAR TUDO</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBy4gbEfmMgm-zgMmGq6h3oQ_-gQy2l2R0", databaseURL: "https://frenquencia-digital-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let sigPad, localStream, currentUserId = null, addressReal = "Buscando...", autorizacaoSelecionada = null, fotoCapturada = null;

    function escolherAcesso(tipo) {
        if (tipo === 'aluno') {
            document.body.classList.add('modo-assinante');
        } else {
            if (prompt("Senha Admin:") !== 'frequencia1992') return;
            document.body.classList.remove('modo-assinante');
        }
        document.getElementById('initialOverlay').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        filtrarTabela();
    }

    function setAutorizacao(valor) {
        autorizacaoSelecionada = valor ? "SIM" : "NÃO";
        document.getElementById('btnSim').className = valor ? 'btn-auth active-sim' : 'btn-auth';
        document.getElementById('btnNao').className = !valor ? 'btn-auth active-nao' : 'btn-auth';
    }

    function filtrarTabela() {
        const input = document.getElementById("searchInput").value;
        // Limpa acentos para a busca
        const filter = input.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
        const tr = document.getElementById("tableBody").getElementsByTagName("tr");
        const modoAssinante = document.body.classList.contains('modo-assinante');

        for (let i = 0; i < tr.length; i++) {
            let txt = tr[i].getAttribute('data-nome') || "";
            const isSigned = tr[i].getAttribute('data-signed') === 'true';

            if (modoAssinante) {
                // SÓ MOSTRA SE digitar 3 letras E o nome bater E não estiver assinado
                if (filter.length >= 3 && txt.indexOf(filter) > -1 && !isSigned) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            } else {
                // MODO ADMIN: mostra tudo ou filtra normal
                tr[i].style.display = (filter === "" || txt.indexOf(filter) > -1) ? "" : "none";
            }
        }
    }

    db.ref('participantes').on('value', snap => {
        const body = document.getElementById('tableBody'); body.innerHTML = '';
        const data = snap.val();
        const isAdmin = !document.body.classList.contains('modo-assinante');
        
        if (data) Object.keys(data).forEach(key => {
            const p = data[key];
            // Guarda nome limpo para busca sem erro
            const nomeParaBusca = p.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
            
            const tr = document.createElement('tr');
            tr.setAttribute('data-nome', nomeParaBusca);
            tr.setAttribute('data-signed', p.signed);
            
            tr.innerHTML = `
                <td class="col-status">${p.signed ? '<span class="status-txt assinado">Assinado</span>' : '<span class="status-txt pendente">Pendente</span>'}</td>
                <td class="col-nome"><b>${p.name}</b><br><small>${p.turma || ''}</small></td>
                <td class="col-admin col-admin-reg">${p.signed ? `<img src="${p.sigData}" class="signed-thumb" onclick="ver('${p.sigData}')"><img src="${p.photo}" class="signed-thumb" onclick="ver('${p.photo}')">` : '-'}</td>
                <td class="col-admin col-admin-gps"><span class="geo-label">${p.geo || '-'}</span></td>
                <td class="col-acao">
                    <div class="btn-group">
                        <button onclick="abrirAssinatura('${key}','${p.name}')" style="padding:4px 8px">${p.signed ? 'Ref.' : 'ASSINAR'}</button>
                        ${isAdmin ? `<button class="danger" onclick="excluir('${key}')" style="padding:4px 8px">X</button>` : ''}
                    </div>
                </td>
            `;
            body.appendChild(tr);
        });
        filtrarTabela();
    });

    function abrirAssinatura(id, nome) {
        currentUserId = id; autorizacaoSelecionada = null; fotoCapturada = null;
        document.getElementById('nomeAssinando').innerText = nome;
        document.getElementById('btnSim').className = 'btn-auth';
        document.getElementById('btnNao').className = 'btn-auth';
        document.getElementById('signModal').style.display = 'flex';
        
        navigator.geolocation.getCurrentPosition(pos => {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
            .then(r => r.json()).then(d => {
                addressReal = d.address.road ? (d.address.road + ", " + (d.address.house_number || "S/N")) : d.display_name;
                document.getElementById('geoStatus').innerText = "📍 " + addressReal;
            });
        });

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => {
            localStream = s; document.getElementById('video').srcObject = s;
            document.getElementById('video').style.display = 'block';
            document.getElementById('photoPreview').style.display = 'none';
        });

        setTimeout(() => {
            const cv = document.getElementById("sigCanvas");
            cv.width = cv.offsetWidth; cv.height = cv.offsetHeight;
            sigPad = new SignaturePad(cv, {backgroundColor: 'rgb(255,255,255)'});
        }, 500);
    }

    document.getElementById('takePhoto').onclick = () => {
        const v = document.getElementById('video');
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        fotoCapturada = c.toDataURL('image/jpeg');
        document.getElementById('photoPreview').src = fotoCapturada;
        document.getElementById('photoPreview').style.display = 'block';
        v.style.display = 'none';
    };

    function resetMedia() {
        fotoCapturada = null;
        document.getElementById('photoPreview').style.display = 'none';
        document.getElementById('video').style.display = 'block';
    }

    document.getElementById('saveData').onclick = () => {
        if (!autorizacaoSelecionada) return alert("Responda SIM ou NÃO.");
        if (!fotoCapturada) return alert("⚠️ É OBRIGATÓRIO tirar a foto!");
        if (sigPad.isEmpty()) return alert("Assine primeiro.");

        db.ref('participantes/' + currentUserId).update({
            signed: true, photo: fotoCapturada, sigData: sigPad.toDataURL('image/jpeg'),
            time: new Date().toLocaleString(), geo: addressReal, autorizado: autorizacaoSelecionada
        }).then(() => {
            fecharModais();
            document.getElementById('successToast').style.display = 'block';
            document.getElementById('searchInput').value = "";
            setTimeout(() => { document.getElementById('successToast').style.display = 'none'; filtrarTabela(); }, 2000);
        });
    };

    function fecharModais() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        if (localStream) localStream.getTracks().forEach(t => t.stop());
    }

    document.getElementById('addBtn').onclick = () => {
        const n = document.getElementById('nameInput').value;
        const t = document.getElementById('turmaInput').value;
        if(n) db.ref('participantes').push().set({ name: n, turma: t, signed: false });
        document.getElementById('nameInput').value = "";
    };

    function excluir(id) {
        if (confirm(`Excluir este registro?`)) db.ref('participantes/' + id).remove();
    }

    document.getElementById('clearAllBtn').onclick = () => {
        if(confirm("Apagar tudo?") && prompt("Senha:") === '1992') db.ref('participantes').remove();
    };

    function ver(src) { document.getElementById('fullImage').src = src; document.getElementById('viewModal').style.display = 'flex'; }
</script>
</body>
</html>
