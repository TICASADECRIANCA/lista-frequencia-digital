<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Frequência Digital</title>
    <style>
        :root{--accent:#0b74e6; --danger:#ef4444; --success:#16a34a; --warning:#f97316; --bg-light:#f5f7fb;}
        
        body { 
            font-family: Inter, system-ui, sans-serif; 
            margin: 0; 
            padding: 5px; 
            background-image: url('fundo.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: var(--bg-light); 
            overflow-x: hidden; /* Impede rolagem lateral no corpo */
        }

        .container { 
            max-width: 100%;
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 10px; 
            border-radius: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        .header-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .logo-escola { height: 40px; width: auto; object-fit: contain; }
        h1 { margin: 0; font-size: 18px; color: #333; }

        .controls { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
        input, button { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px; }
        button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
        button.danger { background: var(--danger); color: #fff; padding: 8px 10px; }
        
        #searchInput { border: 2px solid var(--accent); flex: 1; min-width: 200px; font-size: 14px; background: white; }
        
        /* AJUSTE DA TABELA PARA NÃO ROLAR */
        .table-responsive { width: 100%; overflow-x: hidden; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; } /* Layout fixo evita expansão */
        
        th, td { 
            padding: 6px 2px; 
            border-bottom: 1px solid #eee; 
            text-align: left; 
            font-size: 10px; 
            word-wrap: break-word; /* Força quebra de texto */
        }

        /* Larguras das colunas para celular */
        th:nth-child(1), td:nth-child(1) { width: 45px; } /* Status */
        th:nth-child(2), td:nth-child(2) { width: auto; } /* Nome */
        th:nth-child(3), td:nth-child(3) { width: 75px; } /* Registros */
        th:nth-child(5), td:nth-child(5) { width: 65px; } /* Ações */

        .status-badge { padding: 3px 5px; border-radius: 10px; font-size: 9px; font-weight: bold; }
        .status-pendente { background: #fee2e2; color: #ef4444; }
        .status-assinado { background: #dcfce7; color: #16a34a; }
        
        #tableBody tr { display: none; }
        .mostrar-linha { display: table-row !important; }
        
        .signed-thumb { height: 30px; width: 30px; border-radius: 4px; border: 1px solid #ddd; object-fit: cover; }
        
        .geo-info { 
            font-size: 8px; 
            color: #666; 
            display: block; 
            line-height: 1.1; 
            max-width: 100%; 
            white-space: normal; /* Permite que o endereço quebre linha */
        }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 10px; }
        .card { background: #fff; padding: 15px; border-radius: 12px; width: 100%; max-width: 400px; box-sizing: border-box; }
        .signature-wrapper { border: 2px solid #333; border-radius: 8px; height: 150px; background: #fff; }
        #video, #photoPreview { width: 100%; border-radius: 8px; background: #000; margin-bottom: 5px; }
        
        /* Esconde GPS no modo aluno para economizar espaço */
        body.modo-colaborador .col-admin { display: none; }
        body.modo-colaborador th:nth-child(2), body.modo-colaborador td:nth-child(2) { width: 60%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <img src="logo.png" alt="Logo" class="logo-escola" onerror="this.style.display='none'">
        <h1>Frequência</h1>
    </div>
    
    <div class="controls" id="adminPanel">
        <input id="nameInput" placeholder="Nome" style="flex:1"/>
        <button id="addBtn">Add</button>
        <button id="exportExcel" style="background:#1d6f42">Excel</button>
        <button id="clearAllBtn" class="danger">Limpar</button>
    </div>

    <div class="controls">
        <input id="searchInput" type="text" placeholder="🔍 BUSCAR MEU NOME..." onkeyup="filtrarTabela()">
    </div>

    <div class="table-responsive">
        <table id="mainTable">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Nome</th>
                    <th class="col-admin">Fotos</th>
                    <th class="col-admin">Endereço</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="signModal" class="modal">
    <div class="card">
        <h4 id="nomeAssinando" style="margin:0 0 10px 0">Assinar</h4>
        <div id="geoStatus" style="font-size:10px; color:var(--warning); margin-bottom:5px">📍 Localizando...</div>
        
        <video id="video" autoplay playsinline></video>
        <img id="photoPreview" style="display:none;" />
        <button id="takePhoto" style="width:100%; background: #333; margin-bottom:10px">📸 Tirar Foto</button>

        <div class="signature-wrapper"><canvas id="sigCanvas" style="width:100%;height:100%"></canvas></div>
        <button id="clearSig" style="background:none; color:#666; width:100%; font-size:10px">LIMPAR ASSINATURA</button>

        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button onclick="fecharModais()" style="background:#ccc; flex:1">Sair</button>
            <button id="saveData" style="flex:2; background: var(--success)">FINALIZAR</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
    const ADMIN_PASSWORD = '1992';
    const firebaseConfig = {
        apiKey: "AIzaSyBy4gbEfmMgm-zgMmGq6h3oQ_-gQy2l2R0",
        authDomain: "frenquencia-digital.firebaseapp.com",
        databaseURL: "https://frenquencia-digital-default-rtdb.firebaseio.com",
        projectId: "frenquencia-digital",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let sigPad, localStream, currentUserId = null, currentFullAddress = "Não capturado";

    const urlParams = new URLSearchParams(window.location.search);
    const eModoColaborador = urlParams.has('modo');
    if (eModoColaborador) document.body.classList.add('modo-colaborador');

    function filtrarTabela() {
        const filter = document.getElementById("searchInput").value.toUpperCase();
        const tr = document.getElementById("tableBody").getElementsByTagName("tr");
        for (let i = 0; i < tr.length; i++) {
            const txtValue = tr[i].innerText.toUpperCase();
            tr[i].classList.toggle('mostrar-linha', eModoColaborador ? (filter.length >= 3 && txtValue.indexOf(filter) > -1) : (filter === "" || txtValue.indexOf(filter) > -1));
        }
    }

    db.ref('participantes').on('value', (snapshot) => {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        const data = snapshot.val();
        if (data) {
            Object.keys(data).forEach(key => {
                const p = data[key];
                const tr = document.createElement('tr');
                const statusHtml = p.signed ? `<span class="status-badge status-assinado">Sim</span>` : `<span class="status-badge status-pendente">Não</span>`;
                
                tr.innerHTML = `
                    <td>${statusHtml}</td>
                    <td><b>${p.name}</b></td>
                    <td class="col-admin">${p.signed ? `<img src="${p.sigData}" class="signed-thumb"><img src="${p.photo}" class="signed-thumb">` : '-'}</td>
                    <td class="col-admin"><span class="geo-info">${p.geo || '-'}</span></td>
                    <td style="display:flex; gap:2px">
                        ${p.signed ? `<button onclick="tentarRefazer('${key}','${p.name}')">Ref.</button>` : `<button onclick="abrirAssinatura('${key}','${p.name}')">ASSINAR</button>`}
                        ${!eModoColaborador ? `<button class="danger" onclick="excluir('${key}','${p.name}')">X</button>` : ''}
                    </td>
                `;
                tableBody.appendChild(tr);
            });
            filtrarTabela();
        }
    });

    function abrirAssinatura(id, nome) {
        currentUserId = id;
        document.getElementById('nomeAssinando').innerText = nome;
        document.getElementById('signModal').style.display = 'flex';
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
                .then(r => r.json()).then(data => {
                    currentFullAddress = data.address.road ? (data.address.road + ", " + (data.address.house_number || "S/N")) : data.display_name;
                    document.getElementById('geoStatus').innerText = "📍 Local OK";
                });
            });
        }

        setTimeout(() => {
            const canvas = document.querySelector("#sigCanvas");
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            sigPad = new SignaturePad(canvas);
        }, 300);

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => {
            localStream = s;
            document.getElementById('video').srcObject = s;
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('video').style.display = 'block';
        });
    }

    document.getElementById('takePhoto').onclick = () => {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        document.getElementById('photoPreview').src = canvas.toDataURL('image/jpeg');
        document.getElementById('photoPreview').style.display = 'block';
        document.getElementById('video').style.display = 'none';
    };

    document.getElementById('saveData').onclick = () => {
        const photo = document.getElementById('photoPreview').src;
        if(sigPad.isEmpty() || !photo.startsWith('data')) return alert("Foto e Assinatura!");
        db.ref('participantes/' + currentUserId).update({
            signed: true, sigData: sigPad.toDataURL(), photo: photo, 
            time: new Date().toLocaleString(), geo: currentFullAddress
        }).then(() => {
            fecharModais();
            document.getElementById('searchInput').value = "";
            filtrarTabela();
        });
    };

    function fecharModais() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        if(localStream) localStream.getTracks().forEach(t => t.stop());
    }

    function excluir(id, n) { if(prompt("Senha:") === ADMIN_PASSWORD) db.ref('participantes/' + id).remove(); }
    function tentarRefazer(id, n) { if(prompt("Senha:") === ADMIN_PASSWORD) abrirAssinatura(id, n); }
    document.getElementById('addBtn').onclick = () => {
        const n = document.getElementById('nameInput').value;
        if(n) db.ref('participantes').push().set({ name: n, turma: '', signed: false });
    };
    document.getElementById('clearAllBtn').onclick = () => { if(confirm("Apagar tudo?") && prompt("Senha:") === ADMIN_PASSWORD) db.ref('participantes').remove(); };
</script>
</body>
</html>
