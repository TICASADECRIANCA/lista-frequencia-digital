<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Lista de Frequência Digital</title>
    <style>
        :root{--accent:#0b74e6; --danger:#ef4444; --warning:#f97316; --bg-light:#f5f7fb;}
        
        body {
            font-family: Inter, system-ui, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background-image: url('fundo.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92); 
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
        }

        .header-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .logo-escola { height: 50px; width: auto; }
        h1 { margin: 0; font-size: 20px; color: #333; }

        .controls { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        input, button { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; }
        button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; }
        button.danger { background: var(--danger); }
        button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
        
        #searchInput { border: 2px solid var(--accent); flex-grow: 1; font-size: 15px; background: white; }

        /* AJUSTE PARA CABER NA TELA SEM ROLAR LADO A LADO */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; } 
        
        th, td { padding: 8px 4px; border-bottom: 1px solid #eee; text-align: left; font-size: 11px; }
        
        .signed-thumb { height: 35px; border-radius: 4px; margin-right: 2px; border: 1px solid #ddd; vertical-align: middle; }
        .geo-label { font-size: 9px; color: #666; display: block; line-height: 1.2; max-width: 150px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .card { background: #fff; padding: 15px; border-radius: 12px; width: 95%; max-width: 450px; }
        .signature-wrapper { border: 2px solid #333; border-radius: 8px; height: 180px; touch-action: none; background: white; }
        #video, #photoPreview { width: 100%; border-radius: 8px; background: #000; }

        body.modo-colaborador #adminPanel, body.modo-colaborador .col-admin { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-container">
        <img src="logo.png" alt="Logo" class="logo-escola" onerror="this.style.display='none'">
        <h1>Frequência Digital</h1>
    </div>
    
    <div class="controls" id="adminPanel">
        <input id="nameInput" placeholder="Nome do Aluno" style="flex:2"/>
        <input id="turmaInput" placeholder="Turma" style="flex:1"/>
        <button id="addBtn">Adicionar</button>
        <button id="showQrBtn" class="ghost">Gerar QR</button>
        <button id="exportExcel" style="background:#1d6f42">Excel</button>
        <button id="clearAllBtn" class="danger">Limpar Tudo</button>
    </div>

    <div class="controls">
        <input id="searchInput" type="text" placeholder="🔍 BUSCAR MEU NOME..." onkeyup="filtrarTabela()">
    </div>

    <div class="table-responsive">
        <table id="mainTable">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Nome / Turma</th>
                    <th class="col-admin">Registros</th>
                    <th class="col-admin">Localização (GPS)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="qrModal" class="modal">
    <div class="card" style="text-align:center; max-width: 300px;">
        <h3>Acesso Celular</h3>
        <div id="qrcode" style="display:flex; justify-content:center; margin:15px 0"></div>
        <button onclick="fecharModais()" class="ghost" style="width:100%">Fechar</button>
    </div>
</div>

<div id="signModal" class="modal">
    <div class="card">
        <h3 id="nomeAssinando" style="margin:0 0 10px 0">Assinar</h3>
        <div id="geoStatus" style="font-size:10px; color:var(--warning); font-weight:bold">📍 Localizando endereço...</div>
        
        <video id="video" autoplay playsinline></video>
        <img id="photoPreview" style="display:none;" />
        <button id="takePhoto" style="width:100%; margin: 5px 0; background:#333">📸 Tirar Foto</button>

        <div class="signature-wrapper"><canvas id="sigCanvas" style="width:100%;height:100%"></canvas></div>
        <button id="clearSig" style="background:none; color:#666; width:100%; font-size:10px; border:none; margin-top:5px">LIMPAR ASSINATURA</button>

        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button onclick="fecharModais()" style="background:#ccc; flex:1">Sair</button>
            <button id="saveData" style="flex:2; background: #16a34a">FINALIZAR</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
    const ADMIN_PASSWORD = '1992';
    const firebaseConfig = {
        apiKey: "AIzaSyBy4gbEfmMgm-zgMmGq6h3oQ_-gQy2l2R0",
        authDomain: "frenquencia-digital.firebaseapp.com",
        databaseURL: "https://frenquencia-digital-default-rtdb.firebaseio.com",
        projectId: "frenquencia-digital",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let sigPad, localStream, currentUserId = null, addressReal = "Buscando...";

    const urlParams = new URLSearchParams(window.location.search);
    const eModoColaborador = urlParams.has('modo');
    if (eModoColaborador) document.body.classList.add('modo-colaborador');

    function filtrarTabela() {
        const filter = document.getElementById("searchInput").value.toUpperCase();
        const tr = document.getElementById("tableBody").getElementsByTagName("tr");
        for (let i = 0; i < tr.length; i++) {
            const txt = tr[i].innerText.toUpperCase();
            tr[i].style.display = (eModoColaborador ? (filter.length >= 3 && txt.indexOf(filter) > -1) : (filter === "" || txt.indexOf(filter) > -1)) ? "" : "none";
        }
    }

    db.ref('participantes').on('value', (snapshot) => {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        const data = snapshot.val();
        if (data) Object.keys(data).forEach(key => {
            const p = data[key];
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${p.signed ? '✅' : '❌'}</td>
                <td><b>${p.name}</b><br><small>${p.turma || 'S/T'}</small></td>
                <td class="col-admin">${p.signed ? `<img src="${p.sigData}" class="signed-thumb"><img src="${p.photo}" class="signed-thumb">` : '-'}</td>
                <td class="col-admin"><span class="geo-label">${p.geo || '-'}</span></td>
                <td style="display:flex; gap:4px">
                    ${p.signed ? `<button onclick="tentarRefazer('${key}','${p.name}')">Refazer</button>` : `<button onclick="abrirAssinatura('${key}','${p.name}')">ASSINAR</button>`}
                    ${!eModoColaborador ? `<button class="danger" onclick="excluir('${key}','${p.name}')">X</button>` : ''}
                </td>
            `;
            tableBody.appendChild(tr);
        });
        filtrarTabela();
    });

    function abrirAssinatura(id, nome) {
        currentUserId = id;
        document.getElementById('nomeAssinando').innerText = nome;
        document.getElementById('signModal').style.display = 'flex';
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
                .then(r => r.json()).then(d => {
                    addressReal = d.address.road ? (d.address.road + ", " + (d.address.house_number || "S/N")) : d.display_name;
                    document.getElementById('geoStatus').innerText = "📍 Endereço capturado";
                });
            });
        }
        setTimeout(() => {
            const canvas = document.querySelector("#sigCanvas");
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            sigPad = new SignaturePad(canvas);
        }, 300);
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => {
            localStream = s;
            document.getElementById('video').srcObject = s;
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('video').style.display = 'block';
        });
    }

    document.getElementById('takePhoto').onclick = () => {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        document.getElementById('photoPreview').src = canvas.toDataURL('image/jpeg');
        document.getElementById('photoPreview').style.display = 'block';
        document.getElementById('video').style.display = 'none';
    };

    document.getElementById('saveData').onclick = () => {
        const photo = document.getElementById('photoPreview').src;
        if(sigPad.isEmpty() || !photo.startsWith('data')) return alert("Foto e Assinatura!");
        db.ref('participantes/' + currentUserId).update({
            signed: true, sigData: sigPad.toDataURL(), photo: photo, 
            time: new Date().toLocaleString(), geo: addressReal
        }).then(() => { fecharModais(); filtrarTabela(); });
    };

    function fecharModais() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        if(sigPad) sigPad.clear();
    }

    function excluir(id, n) { if(prompt(`Senha para excluir ${n}:`) === ADMIN_PASSWORD) db.ref('participantes/' + id).remove(); }
    function tentarRefazer(id, n) { if(prompt("Senha para REFAZER:") === ADMIN_PASSWORD) abrirAssinatura(id, n); }

    document.getElementById('addBtn').onclick = () => {
        const n = document.getElementById('nameInput').value;
        const t = document.getElementById('turmaInput').value;
        if(n) db.ref('participantes').push().set({ name: n, turma: t, signed: false });
    };

    document.getElementById('showQrBtn').onclick = () => {
        document.getElementById('qrcode').innerHTML = "";
        const link = window.location.href.split('?')[0] + "?modo=1";
        new QRCode(document.getElementById('qrcode'), { text: link, width: 180, height: 180 });
        document.getElementById('qrModal').style.display = 'flex';
    };

    document.getElementById('clearAllBtn').onclick = () => { if(prompt("Senha para LIMPAR TUDO:") === ADMIN_PASSWORD) db.ref('participantes').remove(); };

    document.getElementById('clearSig').onclick = () => sigPad.clear();

    document.getElementById('exportExcel').onclick = () => {
        db.ref('participantes').once('value', (snapshot) => {
            const rows = [["Status", "Nome", "Turma", "Data/Hora", "Localização"]];
            const data = snapshot.val();
            if (data) Object.keys(data).forEach(k => {
                const p = data[k];
                rows.push([p.signed ? "Assinado" : "Pendente", p.name, p.turma || "S/T", p.time || "-", p.geo || "-"]);
            });
            const ws = XLSX.utils.aoa_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Frequencia");
            XLSX.writeFile(wb, "frequencia_com_gps.xlsx");
        });
    };
</script>
</body>
</html>
